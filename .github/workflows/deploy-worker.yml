name: Deploy Worker to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - 'db/migrations/**'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write denylist from secret
        run: |
          mkdir -p .data-scan
          if [ -n "$DATA_SCAN_DENYLIST" ]; then
            printf '%s' "$DATA_SCAN_DENYLIST" > .data-scan/denylist.txt
          fi
        env:
          DATA_SCAN_DENYLIST: ${{ secrets.DATA_SCAN_DENYLIST }}
      - uses: asiakay/data-scan@v1
        with:
          fail-on-match: 'true'

  deploy:
    name: Deploy masshealth-crm-api
    needs: scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply D1 migrations
        run: |
          set +e
          output=$(npx wrangler@4 d1 migrations apply masshealth-crm-db --remote 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ]; then
            if echo "$output" | grep -qE "7403|account is not valid|not authorized to access this service"; then
              echo "::warning::Migration skipped — CLOUDFLARE_ACCOUNT_ID secret does not match the Cloudflare account. Update repo Settings → Secrets → CLOUDFLARE_ACCOUNT_ID with the 32-char hex ID from dash.cloudflare.com."
              exit 0
            fi
            exit $code
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy via Wrangler
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
