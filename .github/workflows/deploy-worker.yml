name: Deploy Worker to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write denylist from secret
        run: |
          mkdir -p .data-scan
          if [ -n "$DATA_SCAN_DENYLIST" ]; then
            printf '%s' "$DATA_SCAN_DENYLIST" > .data-scan/denylist.txt
          fi
        env:
          DATA_SCAN_DENYLIST: ${{ secrets.DATA_SCAN_DENYLIST }}
      - uses: asiakay/data-scan@v1
        with:
          fail-on-match: 'true'

  deploy:
    name: Deploy masshealth-crm-api
    needs: scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy via Wrangler
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
